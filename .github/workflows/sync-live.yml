# Regenerates live.json on the orphan branch `live-data`.
# The GitHub Pages site reads that file through a raw.githubusercontent.com
# mirror race — unlike api.github.com, the raw host is cache-friendly and is
# not rate-limited per visitor IP. Names and URLs of third-party sites are
# intentionally absent: they stay inside the app.
name: Sync Live Snapshot

on:
  schedule:
    - cron: "23 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "app/src/main/assets/app_config.json"
      - ".github/workflows/sync-live.yml"
      - ".github/scripts/sync_live.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-live
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build public snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/sync_live.py

      - name: Publish to live-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin live-data:live-data 2>/dev/null \
            && git checkout live-data \
            || { git checkout --orphan live-data && git rm -rf . >/dev/null 2>&1 || true; }
          cp /tmp/live.json live.json
          git add live.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: sync live snapshot"
          git push origin live-data
